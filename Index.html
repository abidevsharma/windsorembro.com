<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Inter', sans-serif;
      text-align: center;
      padding: 2rem;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.02em;
      max-width: 14ch;
    }

    h1 span {
      font-weight: 600;
      color: #fff;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #333;
      margin: 2.5rem auto;
    }

    p {
      font-size: 1rem;
      color: #666;
      max-width: 36ch;
      line-height: 1.7;
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      color: #444;
    }
  </style>
</head>
<body>

  <div class="badge">We're working on it</div>

  <h1>Something <span>great</span><br>is coming soon</h1>

  <div class="divider"></div>

  <p>We're putting the finishing touches on our website. Check back soon.</p>

  <footer>© 2026 — Your Name</footer>

</body>
</html>
